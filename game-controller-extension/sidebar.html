<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeuroReach game controller</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fdf9f4;
        color: #40394b;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      p {
        margin: 24px;
        font: 16px/1.5 system-ui;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <p role="status">
      Open a supported game, then choose its play area from the NeuroReach
      extension.
    </p>
    <iframe hidden title="NeuroReach game controller" allow="camera"></iframe>
    <script src="sites.js"></script>
    <script src="sidebar.js"></script>
  </body>
</html>
