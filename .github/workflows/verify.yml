name: Verify NeuroReach
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix patient-web ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neuroreach-web
          path: patient-web/dist
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix patient-web ci
      - run: npm --prefix clinician-console ci
      - run: npm test
      - run: npm run build
      - run: python3 packaging/verify-extension.py
      - run: npm --prefix clinician-console run build:main
      - run: npm --prefix clinician-console run build:renderer
      - run: npm --prefix clinician-console test
      - working-directory: patient-web
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: patient-web
        env:
          NEUROREACH_BROWSER: chromium
        run: npm run test:e2e
      - working-directory: patient-web
        env:
          NEUROREACH_BROWSER: firefox
        run: npm run test:e2e -- practice.spec.ts guest-handoff.spec.ts -g "guest grows|phone player|camera denial|the next guest|a guest tab"
      - working-directory: patient-web
        env:
          NEUROREACH_BROWSER: webkit
        run: npm run test:e2e -- practice.spec.ts guest-handoff.spec.ts -g "guest grows|phone player|camera denial|the next guest|a guest tab"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-diagnostics
          path: patient-web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: neuroreach-extension-store
          path: |
            dist/extension/*.zip
            dist/extension/SHA256SUMS.txt
            docs/extension-store/
  signal-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r signal-engine/requirements.txt pytest
      - run: python -m pytest -q signal-engine/tests
  windows-companion:
    permissions:
      actions: read
      contents: read
    runs-on: windows-latest
    needs: companion-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neuroreach-web
          path: patient-web/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r packaging/requirements-build.txt pytest
      - run: python -m pytest -q signal-engine/tests/test_clinic_records.py signal-engine/tests/test_local_companion.py signal-engine/tests/test_display_pairing.py signal-engine/tests/test_personal_model.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix patient-web ci
      - name: Install browser for extension acceptance
        working-directory: patient-web
        run: npx playwright install chromium
      - run: python -m PyInstaller --clean --noconfirm packaging/companion.spec
      - name: Check packaged startup and assets
        timeout-minutes: 2
        shell: pwsh
        run: |
          $probe = Start-Process dist/NeuroReach/NeuroReach.exe -ArgumentList "--help" -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Frozen executable failed to import its runtime" }
          $server = Start-Process -RedirectStandardError "$env:RUNNER_TEMP/companion-err.log" -RedirectStandardOutput "$env:RUNNER_TEMP/companion-out.log" dist/NeuroReach/NeuroReach.exe -ArgumentList "--port","18766" -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 45; $i++) {
              if ($server.HasExited) { throw "Companion exited unexpectedly" }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:18766/api/health
                if ($health.app -eq "NeuroReach") { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Companion failed to start" }
            $page = Invoke-WebRequest http://127.0.0.1:18766/
            if ($page.Content -notmatch "NeuroReach") { throw "App entry point missing" }
            $model = Invoke-WebRequest http://127.0.0.1:18766/models/pose_landmarker_lite.task
            if ($model.RawContentLength -lt 5000000) { throw "Bundled camera model missing" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
            Get-Content "$env:RUNNER_TEMP/companion-err.log"
            Get-Content "$env:RUNNER_TEMP/companion-out.log"
          }
      - working-directory: patient-web
        shell: pwsh
        run: |
          $env:NEUROREACH_TEST_PYTHON = (Get-Command python).Source
          $env:NEUROREACH_COMPANION_EXE = (Resolve-Path ../dist/NeuroReach/NeuroReach.exe).Path
          npm run test:e2e -- headset.spec.ts staff.spec.ts staff-launch.spec.ts --workers=2 --grep-invert "moving patient screen"
      # Keep the latency budget meaningful: synthetic EEG/BLAS processing in
      # another test worker must not compete with this wall-clock benchmark.
      # Trace capture adds screenshots/DOM snapshots to both active pages; keep
      # it out of timing measurements while retaining failure screenshots/logs.
      - name: Check live monitor timing in isolation
        working-directory: patient-web
        shell: pwsh
        run: |
          $env:NEUROREACH_TEST_PYTHON = (Get-Command python).Source
          $env:NEUROREACH_COMPANION_EXE = (Resolve-Path ../dist/NeuroReach/NeuroReach.exe).Path
          npm run test:e2e -- staff-launch.spec.ts -g "moving patient screen" --workers=1 --repeat-each=3 --trace off
      - name: Verify extension store archive
        run: |
          node patient-web/scripts/package-controller.mjs
          python packaging/verify-extension.py
      - name: Exercise packaged extension with camera and synthetic EEG
        working-directory: patient-web
        shell: pwsh
        run: |
          Invoke-WebRequest https://storage.googleapis.com/mediapipe-assets/pose.jpg -OutFile "$env:RUNNER_TEMP/extension-pose.jpg"
          $env:NEUROREACH_POSE_FIXTURE = "$env:RUNNER_TEMP/extension-pose.jpg"
          $env:NEUROREACH_TEST_PYTHON = (Get-Command python).Source
          $env:NEUROREACH_EXTENSION_DIR = (Resolve-Path ../dist/extension/unpacked).Path
          npm run test:e2e -- game-controller.spec.ts controller-views.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaged-browser-failure-diagnostics
          path: patient-web/test-results
          retention-days: 7
      - name: Verify desktop and bundled runtime without developer tools
        shell: pwsh
        run: python packaging/verify-companion.py dist/NeuroReach/NeuroReach.exe --screenshot "$env:RUNNER_TEMP/desktop.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-preview
          path: ${{ runner.temp }}/desktop.png
      - name: Build versioned installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DCompanionVersion=0.2.$env:GITHUB_RUN_NUMBER" packaging/windows.iss'
      - name: Find the last available main-branch installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow verify.yml --branch main --event push --status success --limit 20 --json databaseId,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not look up previous verified builds" }
          foreach ($run in $runs) {
            if ($run.databaseId -ge [long]$env:GITHUB_RUN_ID -or $run.headSha -eq $env:GITHUB_SHA) { continue }
            $url = "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.databaseId)/artifacts?name=neuroreach-windows-prototype"
            $artifacts = gh api $url | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect installer artifacts" }
            if ($artifacts.artifacts | Where-Object { -not $_.expired }) {
              "run=$($run.databaseId)" >> $env:GITHUB_OUTPUT
              Write-Host "Using main build $($run.headSha) from run $($run.databaseId)"
              break
            }
          }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          name: neuroreach-windows-prototype
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Exercise the installed station and recover its saved visit
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP "previous/NeuroReach-Setup.exe"
          if (Test-Path $previous) {
            python packaging/verify-windows-upgrade.py dist/NeuroReach-Setup.exe --previous $previous
          } else {
            Write-Host "::notice::No previous installer is available. Checking fresh install and reinstall."
            python packaging/verify-windows-upgrade.py dist/NeuroReach-Setup.exe
          }
      - uses: actions/upload-artifact@v4
        with:
          name: neuroreach-windows-prototype
          path: dist/NeuroReach-Setup.exe

  macos-companion:
    needs: companion-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: Apple-Silicon
          - runner: macos-15-intel
            architecture: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neuroreach-web
          path: patient-web/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native libraries
        run: |
          brew install labstreaminglayer/tap/lsl openssl@3
          echo "PYLSL_LIB=$(brew --prefix lsl)/lib/liblsl.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      # Intel builds cryptography from source. Its OpenSSL must be linked
      # statically, like the upstream wheels, to avoid colliding with the
      # different libssl.3 bundled by Python's standard ssl module.
      - name: Install packaging dependencies
        env:
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir -r packaging/requirements-build.txt
      - name: Check isolated cryptography linkage
        run: |
          python - <<'PY'
          import subprocess
          import cryptography.hazmat.bindings._rust as binding
          libraries = subprocess.check_output(['otool', '-L', binding.__file__], text=True)
          assert 'libssl' not in libraries and 'libcrypto' not in libraries, libraries
          PY
      - name: Build desktop application
        env:
          NEUROREACH_VERSION: 0.2.${{ github.run_number }}
        run: python -m PyInstaller --clean --noconfirm packaging/companion.spec
      - name: Build drag-to-Applications installer
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          ditto dist/NeuroReach.app "$RUNNER_TEMP/dmg/NeuroReach.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          cp packaging/INSTALL-MAC.txt "$RUNNER_TEMP/dmg/Start here.txt"
          hdiutil create -volname NeuroReach -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/NeuroReach-macOS-$ARCHITECTURE.dmg"
          hdiutil verify "dist/NeuroReach-macOS-$ARCHITECTURE.dmg"
      - name: Install from the disk image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -p "$RUNNER_TEMP/mounted" "$RUNNER_TEMP/installed"
          hdiutil attach "dist/NeuroReach-macOS-$ARCHITECTURE.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mounted"
          ditto "$RUNNER_TEMP/mounted/NeuroReach.app" "$RUNNER_TEMP/installed/NeuroReach.app"
          hdiutil detach "$RUNNER_TEMP/mounted"
          codesign --verify --deep --strict "$RUNNER_TEMP/installed/NeuroReach.app"
      - name: Verify the bundled desktop and saved records
        run: python packaging/verify-companion.py "$RUNNER_TEMP/installed/NeuroReach.app/Contents/MacOS/NeuroReach" --screenshot "$RUNNER_TEMP/desktop.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.architecture }}-desktop-preview
          path: ${{ runner.temp }}/desktop.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuroreach-macos-${{ matrix.architecture }}
          path: dist/*.dmg
