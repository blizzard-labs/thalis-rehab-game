name: Verify NeuroReach
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix patient-web ci
      - run: npm --prefix clinician-console ci
      - run: npm test
      - run: npm run build
      - run: npm --prefix clinician-console run build:main
      - run: npm --prefix clinician-console run build:renderer
      - run: npm --prefix clinician-console test
      - working-directory: patient-web
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: patient-web
        env:
          NEUROREACH_BROWSER: chromium
        run: npm run test:e2e
      - working-directory: patient-web
        env:
          NEUROREACH_BROWSER: firefox
        run: npm run test:e2e -- practice.spec.ts guest-handoff.spec.ts -g "guest grows|phone player|camera denial|the next guest|a guest tab"
      - working-directory: patient-web
        env:
          NEUROREACH_BROWSER: webkit
        run: npm run test:e2e -- practice.spec.ts guest-handoff.spec.ts -g "guest grows|phone player|camera denial|the next guest|a guest tab"
      - uses: actions/upload-artifact@v4
        with:
          name: neuroreach-web
          path: patient-web/dist
  signal-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r signal-engine/requirements.txt pytest
      - run: python -m pytest -q signal-engine/tests
  windows-companion:
    permissions:
      actions: read
      contents: read
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neuroreach-web
          path: patient-web/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r signal-engine/requirements-companion.txt pyinstaller==6.16.0 pytest
      - run: python -m pytest -q signal-engine/tests/test_clinic_records.py signal-engine/tests/test_local_companion.py signal-engine/tests/test_display_pairing.py signal-engine/tests/test_personal_model.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix patient-web ci
      - run: python -m PyInstaller --clean --noconfirm packaging/companion.spec
      - shell: pwsh
        run: |
          & dist/NeuroReach/NeuroReach.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen executable failed to import its runtime" }
          $server = Start-Process -RedirectStandardError "$env:RUNNER_TEMP/companion-err.log" -RedirectStandardOutput "$env:RUNNER_TEMP/companion-out.log" dist/NeuroReach/NeuroReach.exe -ArgumentList "--port","18766" -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 45; $i++) {
              if ($server.HasExited) { throw "Companion exited unexpectedly" }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:18766/api/health
                if ($health.app -eq "NeuroReach") { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Companion failed to start" }
            $page = Invoke-WebRequest http://127.0.0.1:18766/
            if ($page.Content -notmatch "NeuroReach") { throw "App entry point missing" }
            $model = Invoke-WebRequest http://127.0.0.1:18766/models/pose_landmarker_lite.task
            if ($model.RawContentLength -lt 5000000) { throw "Bundled camera model missing" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
            Get-Content "$env:RUNNER_TEMP/companion-err.log"
            Get-Content "$env:RUNNER_TEMP/companion-out.log"
          }
      - working-directory: patient-web
        shell: pwsh
        run: |
          $env:NEUROREACH_TEST_PYTHON = (Get-Command python).Source
          $env:NEUROREACH_COMPANION_EXE = (Resolve-Path ../dist/NeuroReach/NeuroReach.exe).Path
          npm run test:e2e -- headset.spec.ts
      - name: Build versioned installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DPrototypeVersion=0.1.$env:GITHUB_RUN_NUMBER" packaging/windows.iss'
      - name: Find the last available main-branch installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow verify.yml --branch main --event push --status success --limit 20 --json databaseId,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not look up previous verified builds" }
          foreach ($run in $runs) {
            if ($run.databaseId -ge [long]$env:GITHUB_RUN_ID -or $run.headSha -eq $env:GITHUB_SHA) { continue }
            $url = "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.databaseId)/artifacts?name=neuroreach-windows-prototype"
            $artifacts = gh api $url | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect installer artifacts" }
            if ($artifacts.artifacts | Where-Object { -not $_.expired }) {
              "run=$($run.databaseId)" >> $env:GITHUB_OUTPUT
              Write-Host "Using main build $($run.headSha) from run $($run.databaseId)"
              break
            }
          }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          name: neuroreach-windows-prototype
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Exercise the installed station and recover its saved visit
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP "previous/NeuroReach-Setup.exe"
          if (Test-Path $previous) {
            python packaging/verify-windows-upgrade.py dist/NeuroReach-Setup.exe --previous $previous
          } else {
            Write-Host "::notice::No previous installer is available. Checking fresh install and reinstall."
            python packaging/verify-windows-upgrade.py dist/NeuroReach-Setup.exe
          }
      - uses: actions/upload-artifact@v4
        with:
          name: neuroreach-windows-prototype
          path: dist/NeuroReach-Setup.exe
